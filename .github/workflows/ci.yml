name: BitChat Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitchat-desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libdbus-1-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build workspace
        run: cargo build --workspace --release --locked

  linux:
    name: Linux discovery preview (Rust 1.85, GTK 4.8)
    runs-on: ubuntu-latest
    container:
      image: rust:1.85-bookworm
      options: --init
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install native and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libgtk-4-dev libdbus-1-dev pkg-config xvfb xauth dbus-x11 python3-dbusmock
      - name: Build at the minimum Rust version
        run: cargo build -p bitchat-desktop-linux --locked
      - name: Test state, GTK launch, and simulated BlueZ behavior
        run: bash apps/linux/scripts/check.sh

  fixtures:
    name: Verify imported fixture provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify fixture copies
        run: python3 scripts/verify-interop-fixtures.py
      - name: Test inherited relay validator
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v
      - name: Verify vendored Arti hashes
        run: python3 scripts/verify-arti-provenance.py

  swift-packages:
    name: Swift package tests (${{ matrix.package }})
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [BitFoundation, BitLogger]
    steps:
      - uses: actions/checkout@v5
      - run: swift test --package-path apps/macos/localPackages/${{ matrix.package }}

  macos:
    name: Build BitChat Desktop macOS Release
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Validate artifact-only clean recipe
        run: bash apps/macos/scripts/check-just-clean-safety.sh
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project apps/macos/BitChatDesktop.xcodeproj \
            -scheme "BitChat Desktop (macOS)" -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath apps/macos/.DerivedData \
            CODE_SIGNING_ALLOWED=NO build
