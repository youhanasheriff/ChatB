name: Build Windows discovery preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Windows x64 native preview
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      # Statically link the Microsoft C runtime for a standalone ZIP.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy --component rustfmt
      - run: cargo +1.85.1 fmt --all -- --check
      - run: cargo +1.85.1 clippy -p bitchat-desktop-windows --all-targets --locked -- -D warnings
      - run: cargo +1.85.1 test -p bitchat-desktop-windows --locked
      - run: cargo +1.85.1 build -p bitchat-desktop-windows --release --locked
      - name: Exercise the native app
        run: ./apps/windows/scripts/check.ps1
      - name: Build installer; verify install, launch, reinstall, and uninstall
        run: python packaging/windows/package-preview.py $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-preview-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
