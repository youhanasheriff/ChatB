ze:12px;flex-shrink:0}.person{display:flex;align-items:center;gap:12px}.row-aside{text-align:right;font-size:10px;color:var(--muted);line-height:1.8}.toggle{width:32px;height:18px;border-radius:12px;background:var(--accent);position:relative;flex-shrink:0}.toggle:after{content:'';position:absolute;right:3px;top:3px;background:var(--bg);width:12px;height:12px;border-radius:50%}.toggle.off{background:var(--line)}.toggle.off:after{right:17px}.field{padding:10px 12px;background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);color:var(--text);font-size:11px;width:100%;outline-offset:2px}.field-label{display:block;font-size:11px;margin-bottom:8px}.field-group{margin-bottom:20px}.messages{padding:26px;flex:1;display:flex;flex-direction:column;gap:26px;min-height:420px}.day{text-align:center;font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:3px}.message{display:flex;gap:13px;font-size:12px;line-height:1.7}.message .meta{display:flex;gap:12px;font-size:10px;margin-bottom:4px}.message .name{color:var(--accent);font-weight:600}.message .time{color:var(--muted)}.delivery{font-size:9px;color:var(--muted);margin-top:7px}.composer{margin:0 25px 23px;padding:9px;background:var(--raised);border:1px solid var(--line);border-radius:var(--radius);display:flex;gap:8px;align-items:center}.composer input{background:none;border:0;color:var(--text);font-size:11px;flex:1;width:50px;padding:4px;outline:none}.composer button{background:none;color:var(--accent);font-size:15px}.composer .send{padding:7px 11px;background:var(--accent);color:var(--bg);border-radius:var(--radius);font-size:11px}.attachment{display:flex;gap:14px;align-items:center;padding:12px 15px;border:1px solid var(--line);background:var(--raised);margin-top:12px;max-width:340px;border-radius:var(--radius);font-size:11px}.wave{display:flex;gap:3px;align-items:center;height:28px}.wave i{width:2px;background:var(--accent)}.centered{text-align:center;padding:48px 25px}.centered h4{font-size:2 </style></head><body>
<header><div><div class="eyebrow">BitChat Desktop / Design studies / 01</div><h1>A familiar mesh. Three ways to see it.</h1><p>Screen-by-screen concepts for the native desktop app. Sample data only.</p></div><div class="directions" role="group" aria-label="Visual direction"><button data-theme="terminal" class="active" aria-pressed="true">01 Terminal</button><button data-theme="native-light" aria-pressed="false">02 Native Light</button><button data-theme="graphite" aria-pressed="false">03 Graphite</button></div></header>
<div class="workbench"><aside class="inventory"><div class="eyebrow" id="count"></div><input id="search" aria-label="Find a screen" placeholder="Find a screen…"><nav class="inventory-list" id="inventory" aria-label="Screens"></nav></aside><main class="stage"><div class="stage-heading"><div><div class="eyebrow" id="position"></div><h2 id="screen-title"></h2></div><div class="stepper"><button id="previous" aria-label="Previous screen">←</button><button id="next" aria-label="Next screen">→</button></div></div><section class="app" id="app" data-theme="terminal" aria-label="Application concept"></section><div class="note"><div><strong id="direction-title"></strong><p id="direction-note"></p></div><div><strong>Existing surface</strong><p id="source-note"></p></div></div><div class="overview"><a href="terminal.png">Terminal overview ↗</a><a href="native-light.png">Native Light overview ↗</a><a href="graphite.png">Graphite overview ↗</a><a href="screen-inventory.json">Screen inventory ↗</a><span>Concepts only · no radio or account connection</span></div></main></div><div id="toast" role="status" class="toast hidden"></div>
<script>
const screens=[
['mesh','Mesh chat','Conversations','chat','ContentView.swift + MessageListView.swift','The public nearby channel; keep transport, time, and sender easy to scan.'],
['location-chat','Location conversation','Conversations','chat','ContentView.swift + LocationChannelsSheet.swift','Public conversation selected by geohash, with scope made explicit.'],
['private','Private conversation','Conversations','chat','ContentSheetViews.swift','Private chat separates encryption status from identity verification.'],
['media-chat','Attachments & voice messages','Conversations','chat','Media/MediaMessageView.swift + Media/VoiceNoteView.swift','Image, file, and voice content belong in the conversation, not a separate destination.'],
['recording','Voice recording','Conversations','chat','ContentComposerView.swift + Media/WaveformView.swift','Recording, cancel, and send states in the existing composer.'],
['live-voice','Live voice','Conversations','chat','Media/LiveVoiceBadge.swift','The current live-voice indicator and controls within a conversation.'],
['people','Nearby people','People & identity','list','ContentSheetViews.swift + MeshPeerList.swift','Mesh people list with explicit reachable and verification states.'],
['bridge','Across the bridge','People & identity','list','BridgePeopleList.swift','People reached through the mesh bridge, clearly separated from direct radio peers.'],
['recent','Recent conversations','People & identity','list','RecentChatList.swift','Recent conversations remain reachable as channels change.'],
['groups','Groups','People & identity','list','GroupChatList.swift','Group list and selection. Group management remains command driven in the current app.'],
['location-people','Location-channel people','People & identity','list','GeohashPeopleList.swift','People in the selected geohash channel and recent private conversations.'],
['fingerprint','Peer fingerprint & alias','People & identity','form','FingerprintView.swift','Compare fingerprints, manage verification, and set a local alias.'],
['my-qr','My verification code','People & identity','form','VerificationViews.swift / MyQRView','Illustrative QR only; no real identity is encoded in this concept.'],
['scan','Scan or paste verification','People & identity','form','VerificationViews.swift / QRScanView','Camera scan and pasted-code fallback; distinct from manual fingerprint comparison.'],
['channels','Location channels','Places & boards','list','LocationChannelsSheet.swift','Mesh and geographic scopes, with exact geohash captions and approximate scope.'],
['invite','Share channel invitation','Places & boards','dialog','ContentHeaderView.swift + LocationChannelsSheet.swift','Fine-precision sharing confirmation and channel invitation payload.'],
['mesh-board','Mesh board','Places & boards','board','NoticesView.swift / mesh tab','Nearby board posts, expiry, urgent notices, and posting controls.'],
['location-board','Location notes','Places & boards','board','NoticesView.swift / geo tab','Location notes include scope, relay state, and permission/retry states.'],
['picker','Choose an image','Media & tools','media','Image Viewers/MacImagePickerView.swift','System file selection keeps this native and lightweight.'],
['image','Image preview & export','Media & tools','media','Image Viewers/ImagePreviewView.swift','Large image preview, export action, and received-media state.'],
['commands','Command suggestions','Media & tools','form','Components/CommandSuggestionsView.swift','Suggestions for the existing slash-command composer.'],
['topology','Mesh topology','Media & tools','form','MeshTopologyView.swift','Display observed links and routes; radio signal is not a distance measurement.'],
['connectivity','Connectivity & relays','Settings & info','form','AppInfoView.swift / Settings','Mesh bridge, Tor routing, and built-in/custom private-message relays.'],
['privacy','Notification privacy & reset','Settings & info','form','AppInfoView.swift / Settings','Hide previews by default and visually separate the panic wipe action.'],
['appearance','Appearance & language','Settings & info','form','AppInfoView.swift / Settings','Theme and language controls; restart notice after language selection.'],
['about','About & help','Settings & info','form','AppInfoView.swift / Info','Feature explanations, how to use the app, and independent upstream attribution.'],
['empty','No nearby peers','States & dialogs','empty','Components/MeshEmptyStateView.swift + Components/MeshRadarView.swift','Discovery empty state within the mesh conversation.'],
['bluetooth','Bluetooth unavailable','States & dialogs','dialog','ContentView.swift + Components/ConnectivityStatusBanner.swift','Powered-off, denied, and unsupported states need different explanations and actions.'],
['tor-blocked','Tor connectivity blocked','States & dialogs','empty','Components/ConnectivityStatusBanner.swift','The Tor-blocked state keeps privacy implications visible.'],
['panic','Confirm panic wipe','States & dialogs','dialog','AppInfoView.swift + ContentView.swift','An explicit destructive confirmation for erasing local data and identity.'],
['wipe-blocked','Incomplete wipe','States & dialogs','empty','Components/PanicWipeBlockedBanner.swift','A failure state that outranks ordinary connectivity status.'],
['clear','Clear conversation','States & dialogs','dialog','MessageListView.swift','Confirm clearing the current local conversation.'],
['actions','Message & participant actions','States & dialogs','dialog','MessageListView.swift','Existing mention, private-message, favorite, block, and copy actions.'],
['legacy','Legacy media warning','States & dialogs','dialog','ContentSheetViews.swift + Media/BlockRevealImageView.swift','Explicit consent before legacy private media without end-to-end encryption.'],
['screenshot','Screenshot privacy notice','States & dialogs','dialog','ContentHeaderView.swift','Explain the existing screenshot privacy limitation.'],
['recording-error','Microphone / recording error','States & dialogs','dialog','ContentView.swift + ContentSheetViews.swift','Permission-denied action opens system microphone settings.'],
['share-import','Review shared content','States & dialogs','dialog','ContentView.swift / sharedContentImportModel','Inherited share-import review; the iOS share extension is outside desktop product scope.']
];
const themes={terminal:['01 / Terminal','A compact monospaced log with restrained green accents. Closest to the current app: thin borders, direct labels, and minimal decoration.'], 'native-light':['02 / Native Light','Bright native surfaces, clear hierarchy, and a calm emerald accent. Dense information stays readable without turning each item into a card.'],graphite:['03 / Graphite','Slate panels, silver type, and a muted cyan navigation accent. Connection and verified status retain their own green indicators.']};
let theme='terminal',active='mesh',drafts={};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const go=(id,label,cls='btn')=>`<button type="button" class="${cls}" data-screen="${id}">${label}</button>`;
const action=(label,cls='btn')=>`<button type="button" class="${cls}" data-demo="${esc(label)}">${label}</button>`;
const field=(label,value,placeholder='')=>`<div class="field-group"><label class="field-label">${label}<input class="field" value="${esc(value)}" placeholder="${esc(placeholder)}"></label></div>`;
const row=(title,description,aside='')=>`<div class="row"><div><div class="row-title">${title}</div><div class="row-description">${description}</div></div>${aside}</div>`;
const toggle=(title,desc,on=true)=>row(title,desc,`<button class="toggle ${on?'':'off'}" aria-label="${title}" aria-pressed="${on}" data-toggle></button>`);
const people=(name,state,status='Encrypted · unverified')=>`<div class="row"><div class="person"><div class="avatar">${name[0]}</div><div><div class="row-title">${name}</div><div class="row-description">${state}</div></div></div><div class="row-aside">${status}<br>${go('private','Message')}</div></div>`;
const wave=()=>`<span class="wave" aria-label="Illustrative waveform">${Array.from({length:34},(_,i)=>`<i style="height:${5+(i*13%23)}px"></i>`).join('')}</span>`;
const qr=()=>`<svg class="qr" viewBox="0 0 29 29" role="img" aria-label="Illustrative QR pattern, not a valid identity">${Array.from({length:29*29},(_,i)=>{let x=i%29,y=Math.floor(i/29);let on=(x*17+y*31+x*y)%7<3;for(let [a,b] of [[0,0],[22,0],[0,22]])if(x>=a&&x<a+7&&y>=b&&y<b+7)on=x===a||x===a+6||y===b||y===b+6||(x>=a+2&&x<=a+4&&y>=b+2&&y<=b+4);return on?`<rect x="${x}" y="${y}" width="1" height="1" fill="#152019"/>`:''}).join('')}</svg><p class="hint" style="text-align:center">Sample code · not scannable</p>`;
const scene=()=>`<svg class="scene" viewBox="0 0 700 240" role="img" aria-label="Sample mountain illustration"><path d="M0 220L130 75L230 175L345 45L470 185L560 100L700 220Z" fill="currentColor" opacity=".15"/><path d="M0 220L130 75L230 175L345 45L470 185L560 100L700 220" fill="none" stroke="currentColor" opacity=".65"/><circle cx="590" cy="47" r="17" fill="currentColor" opacity=".5"/><text x="25" y="220" fill="currentColor" font-size="11">Sample image · ridge-walk.jpg</text></svg>`;
function rail(){return `<aside class="rail"><div class="brand">BitChat Desktop${theme==='terminal'?'/':''}</div><div class="rail-label">Channels</div>${[['mesh','#mesh','12'],['location-chat','#neighborhood','8'],['channels','Location channels','↗'],['mesh-board','Notice board','3']].map(([id,name,n])=>`<button data-screen="${id}" class="${active===id?'selected':''}">${name}<span>${n}</span></button>`).join('')}<div class="rail-label">People</div>${go('people','Nearby people','')}${go('private','Maya','')}${go('groups','Groups','')}${go('recent','Recent chats','')}<div class="rail-label">Tools</div>${go('my-qr','Verify identity','')}${go('connectivity','Settings','')}${go('about','About & help','')}<div class="online"><span class="status-dot"></span>12 nearby · sample</div></aside>`}
function message(name,text,time,extra=''){return `<div class="message"><div class="avatar">${name[0]}</div><div><div class="meta"><span class="name">${name}</span><span class="time">${time}</span></div><div>${text}</div>${extra}</div></div>`}
function chat(id){let privateChat=id==='private',media=['media-chat','recording','live-voice'].includes(id);return `<div class="messages"><div class="day">TODAY · SAMPLE CONVERSATION</div>${message(privateChat?'Maya':'Arun',privateChat?'Are you near the trail entrance?':'Anyone heading out for a walk this afternoon?','14:08')}${message(privateChat?'You':'Youhana',privateChat?'I’m nearby. Meet at the trail entrance?':'I’m around. The mesh is reaching across the park today.','14:09',privateChat?'<div class="delivery">Delivered · identity verified separately</div>':'')}${message('Maya',media?'Here’s the route from this morning.':'Sounds good. I’ll be there in ten minutes.','14:11',media?`<div class="attachment">↗ <div>trail-route.gpx<div class="muted">18 KB · received</div></div>${action('Save')}</div><div class="attachment">${action('▷')}${wave()}<span class="muted">0:18</span></div>`:'')}${id==='live-voice'?'<div class="callout"><span class="status-dot"></span>Maya · live voice · connected '+action('Mute')+'</div>':''}<div id="sent-messages">${(drafts[id]||[]).map(t=>message('You',esc(t),'Now','<div class="delivery">Sample only · not transmitted</div>')).join('')}</div></div><form class="composer" id="composer">${go('picker','＋','')}${id==='recording'?`<span style="font-size:11px;color:var(--danger)">● 00:08</span>${wave()}${action('Cancel')}`:`<input aria-label="Sample message" placeholder="${privateChat?'Message Maya…':'Message '+(id==='location-chat'?'#neighborhood':'#mesh')+'…'}" autocomplete="off">`}${go('recording','◉','')}<button class="send" type="submit">${id==='recording'?'Send voice':'Send ↑'}</button></form>`}
function list(id){if(id==='channels')return '<p class="hint">Location channels use geohash cells. Sharing a smaller cell discloses interest in a smaller area.</p>'+[['Mesh','Bluetooth · nearby','mesh'],['Block','Geohash: 9q8yyw · very local','location-chat'],['Neighborhood','Geohash: 9q8yy · local area','location-chat'],['City','Geohash: 9q8y · wider area','location-chat'],['Region','Geohash: 9q8 · regional','location-chat'],['Country','Geohash: 9q · broad area','location-chat']].map(([n,d,s],i)=>row('#'+n.toLowerCase(),d,go(s,i===0?'12 people':'Join'))).join('')+`<div class="btns">${go('invite','Share invitation')}${action('Location access')}</div>`;
if(id==='groups')return row('#trail-crew','6 members · shared group',go('mesh','Open'))+row('#local-devs','4 members · shared group',go('mesh','Open'))+'<p class="hint">Create and manage groups with the existing group commands.</p>'+go('commands','Show commands');
if(id==='recent')return people('Maya','Seen just now','Verified')+people('Arun','Seen 2 hours ago')+people('Kai','Last conversation yesterday','Offline');
if(id==='bridge')return '<p class="hint">Across the bridge · these peers are reached through internet bridging, rather than a direct Bluetooth link.</p>'+people('Kai','Mesh bridge','Unverified')+people('Lina','Mesh bridge','Verified');
if(id==='location-people')return '<div class="section-label">#9q8yy · location channel</div>'+people('Lina','Location channel · relay','Verified')+people('Kai','Location channel · relay')+'<div class="section-label">Recent</div>'+people('Maya','Direct Bluetooth','Verified');
return '<div class="section-label">#mesh · nearby</div>'+people('Maya','Direct Bluetooth · connected','Encrypted · verified')+people('Arun','Reachable through the mesh','Encrypted · unverified')+'<div class="section-label">Across the bridge</div>'+people('Kai','Internet bridge','Unverified')+'<div class="section-label">Recent & groups</div>'+row('Recent conversations','Maya, Arun, Lina',go('recent','View'))+row('#trail-crew','6 members',go('groups','Open'));}
function form(id){if(id==='fingerprint')return row('Maya','Noise session encrypted · identity not yet verified','<span class="badge">Unverified</span>')+field('Local alias','Maya','Name only on this device')+'<div class="section-label">Their fingerprint</div><div class="fingerprint">3f2a 9c7d 41b1 8e6f<br>c01d e9a7 5bc3 2f90</div><p class="hint">Compare through a trusted channel. Encryption alone does not verify who owns the key.</p><div class="btns">'+action('Copy fingerprint')+action('Mark verified','btn primary')+go('scan','Scan code')+'</div>';
if(id==='my-qr')return `<div class="tabs">${go('my-qr','My code','active')}${go('scan','Scan code','')}</div>${qr()}<p class="hint" style="text-align:center">Share your verification code with someone you trust.</p><div class="fingerprint">3f2a 9c7d 41b1 8e6f c01d e9a7 5bc3 2f90</div><div class="btns">${action('Copy fingerprint')}${go('scan','Scan someone’s code')}</div>`;
if(id==='scan')return `<div class="tabs">${go('my-qr','My code','')}${go('scan','Scan code','active')}</div><div class="card centered"><div class="symbol">⌗</div><h4>Scan a trusted person’s code</h4><p class="hint">The camera preview appears here after system permission.</p>${action('Allow camera')}</div>${field('Or paste a verification code','','bitchat://…')}<div class="btns">${action('Validate code','btn primary')}</div>`;
if(id==='connectivity')return '<div class="section-label">Connectivity</div>'+toggle('Mesh bridge','Carry bridge and location-channel traffic for nearby peers.')+toggle('Route internet traffic through Tor','Relay operators see a Tor exit address rather than your IP.')+'<div class="section-label">Private-message relays</div>'+row('Built-in relay','wss://relay.example.invalid · illustrative address','<span class="badge">Built in</span>')+field('Add a relay','','wss://your-relay.example')+action('Add relay')+`<div class="btns">${go('topology','View mesh topology')}${go('privacy','Privacy settings')}</div>`;
if(id==='privacy')return '<div class="section-label">Notifications</div>'+toggle('Hide message previews','Keep names, content, and location-channel labels off notifications.')+'<div class="section-label">Local data</div><p class="hint">Panic wipe erases local messages, keys, and identity.</p><div class="btns">'+go('panic','Panic wipe','btn danger')+'</div>';
if(id==='appearance')return '<div class="section-label">Appearance</div>'+row('Theme','Visual samples can be switched using the study controls above.','<select class="field" aria-label="Sample theme" id="in-app-theme"><option value="terminal">Terminal</option><option value="native-light">Native Light</option><option value="graphite">Graphite</option></select>')+'<div class="section-label">Language</div>'+row('App language','Restart the app to apply a new language.','<select class="field" aria-label="Sample language"><option>System default</option><option>English</option><option>Tamil</option><option>Hindi</option></select>')+'<p class="hint">The actual app’s existing system/light/dark appearance choices can adopt the selected visual direction. These study themes are proposals.</p>';
if(id==='commands')return field('Message composer','/','Type a command')+[['/help','Show available commands'],['/join #channel','Join a channel'],['/msg @name','Start a private conversation'],['/clear','Clear this conversation'],['/who','See people in the channel']].map(([c,d])=>row(c,d,action('Use command'))).join('')+'<p class="hint">Labels illustrate the existing command-suggestion surface; exact command syntax must follow the app’s parser.</p>';
if(id==='topology')return `<svg class="topology" viewBox="0 0 620 290" role="img" aria-label="Illustrative mesh routes"><line x1="310" y1="150" x2="140" y2="75"/><line x1="310" y1="150" x2="465" y2="75"/><line x1="310" y1="150" x2="470" y2="235"/><line x1="140" y1="75" x2="65" y2="200"/><line x1="465" y1="75" x2="555" y2="165"/>${[[310,150,'You'],[140,75,'Maya'],[465,75,'Arun'],[470,235,'Kai'],[65,200,'Lina'],[555,165,'Noor']].map(([x,y,n])=>`<circle cx="${x}" cy="${y}" r="24"/><text text-anchor="middle" x="${x}" y="${y+43}">${n}</text>`).join('')}</svg>`+row('Connected neighbors','2 direct links · sample','<span class="badge">Connected</span>')+row('Observed route','You → Maya → Lina','2 hops')+'<p class="hint">Nodes and links are sample data. Signal strength does not establish physical distance.</p>';
return '<div class="centered"><div class="symbol">B/</div><h4>BitChat Desktop</h4><p class="hint">An independent Bitchat-compatible client for macOS, Windows, and Linux.</p></div>'+row('Nearby communication','Exchange messages through the Bluetooth mesh.')+row('Private conversations','Encrypted sessions with separate identity verification.')+row('Location channels','Geohash channels delivered through relays.')+row('Independent open source project','By Youhana Sheriff · follows permissionlesstech/bitchat · Unlicense')+'<div class="btns">'+go('commands','How to use')+go('connectivity','Settings')+'</div>';}
function board(id){return `<div class="tabs">${go('mesh-board','Mesh board',id==='mesh-board'?'active':'')}${go('location-board','Location notes',id==='location-board'?'active':'')}</div><p class="hint">${id==='mesh-board'?'Posts discovered through the nearby mesh.':'Location scope: #9q8yy · delivered through relays.'}</p><div class="card"><div class="eyebrow" style="color:var(--accent)">Arun · 12 minutes ago</div><h4 style="margin-top:12px">Trail entrance has moved</h4><p class="hint">Use the east gate while the bridge is being repaired.</p><div class="row-description">Expires in 2 days · sample post</div></div><div class="card"><div class="row-title">Maya · Community walk</div><p class="hint">Meet at the park entrance at 16:00. Everyone welcome.</p><div class="row-description">Expires tomorrow · sample post</div></div>${field('Post a note','','What should people nearby know?')}<div class="btns"><select class="field" style="width:170px" aria-label="Post expiry"><option>Expires in 1 day</option><option>Expires in 7 days</option></select>${action('Post note','btn primary')}</div>`;}
function media(id){return id==='picker'?'<p class="hint">This sheet uses the operating system’s file picker.</p><div class="card">'+field('Folder','Pictures')+row('ridge-walk.jpg','Image · 412 KB',action('Select','btn primary'))+row('trail-map.png','Image · 180 KB',action('Select'))+'</div><div class="btns">'+go('mesh','Cancel')+go('image','Preview selection','btn primary')+'</div>':scene()+'<div class="row"><div class="row-title">ridge-walk.jpg</div><span class="muted">412 KB · sample attachment</span></div><div class="btns">'+action('Export image','btn primary')+go('media-chat','Back to conversation')+'</div>';}
const dialogs={invite:['Share this location channel?','This invitation reveals interest in a small geographic area. A carrier or messaging service may see the link.','Share invitation','channels'],bluetooth:['Bluetooth access required','Enable Bluetooth and allow access in System Settings to connect to nearby devices.','Open Bluetooth settings','mesh'],panic:['Wipe all local data?','This erases messages, keys, and identity on this device. Make this decision deliberately.','Wipe everything','privacy'],clear:['Clear this conversation?','Remove the local message history for this conversation.','Clear conversation','mesh'],legacy:['Send without end-to-end encryption?','This older peer cannot receive encrypted private media. Cancel to keep the attachment unsent.','Send unencrypted','private'],screenshot:['Screenshots can expose messages','The operating system can capture content visible on screen. This app cannot promise screenshot protection.','Understood','mesh'],'recording-error':['Microphone permission denied','Allow microphone access in System Settings, then try recording again.','Open microphone settings','recording'],'share-import':['Use shared content in the composer?','Review the content before sending. This replaces the current draft. The inherited share-extension flow is outside the supported desktop product scope.','Use in composer','mesh']};
function dialog(id){if(id==='actions')return '<div class="modal"><h4>Maya · message actions</h4>'+['Mention','Private message','Favorite','Block','Copy message'].map(n=>row(n,'',n==='Private message'?go('private','Open'):action(n))).join('')+'<div class="btns">'+go('mesh','Cancel')+'</div></div>';let [title,text,confirm,back]=dialogs[id];return `<div class="modal"><h4>${title}</h4><p class="hint">${text}</p>${id==='invite'?'<div class="fingerprint" style="font-size:11px">bitchat://geohash/9q8yy</div>':''}<div class="btns">${go(back,'Cancel')}${action(confirm,['panic','legacy','clear'].includes(id)?'btn danger':'btn primary')}</div><p class="row-description" style="margin-top:18px">Sample dialog · no action affects real data.</p></div>`;}
function empty(id){let data={empty:['⌁','Listening for nearby peers','Keep Bluetooth enabled. Conversations appear as compatible devices become reachable.','people','Nearby people'],'tor-blocked':['↯','Tor connection is blocked','Internet delivery is unavailable while Tor cannot connect. Check connectivity; changing routing has privacy implications.','connectivity','Connectivity settings'],'wipe-blocked':['!','Wipe incomplete','Some local data may remain. Quit and reopen the application to retry. Do not present this state as a successful wipe.','privacy','Review local data']};let [icon,title,text,back,label]=data[id];return `<div class="centered"><div class="symbol">${icon}</div><h4>${title}</h4><p class="hint">${text}</p><div class="btns">${go(back,label,'btn primary')}</div>${id==='wipe-blocked'?'<div class="callout">Wipe incomplete · sample failure state</div>':''}</div>`;}
function render(){const s=screens.find(s=>s[0]===active),i=screens.indexOf(s);$('screen-title').textContent=s[1];$('position').textContent=`SCREEN ${String(i+1).padStart(2,'0')} / ${screens.length} · ${s[2]}`;$('direction-title').textContent=themes[theme][0];$('direction-note').textContent=themes[theme][1];$('source-note').textContent=s[5]+' Source: '+s[4]+'.';$('app').dataset.theme=theme;let kind=s[3],body=kind==='chat'?chat(active):kind==='list'?list(active):kind==='form'?form(active):kind==='board'?board(active):kind==='media'?media(active):kind==='dialog'?dialog(active):empty(active);let subtitles={mesh:'Public channel · 12 nearby peers','location-chat':'#9q8yy · public location channel',private:'Maya · Noise encrypted · identity verified',recording:'Recording sample audio · microphone control', 'live-voice':'Live voice · illustrative active session'};$('app').innerHTML=`<div class="titlebar"><div class="dots"><i></i><i></i><i></i></div>BitChat Desktop<span class="sample">SAMPLE UI</span></div><div class="layout">${rail()}<div class="main"><div class="toolbar"><div><h3>${active==='mesh'?'#mesh':s[1]}</h3><div class="subtitle">${subtitles[active]||'Sample content · '+s[2]}</div></div>${active==='private'?go('fingerprint','Peer details'):'<span class="badge">'+(theme==='terminal'?'mesh / desktop':'BitChat Desktop')+'</span>'}</div>${kind==='chat'?body:`<div class="${kind==='dialog'?'modal-backdrop':'content'}">${body}</div>`}</div></div>`;document.querySelectorAll('.screen-choice').forEach(b=>{let selected=b.dataset.screen===active;b.classList.toggle('active',selected);if(selected)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.querySelectorAll('.directions button').forEach(b=>{b.classList.toggle('active',b.dataset.theme===theme);b.setAttribute('aria-pressed',String(b.dataset.theme===theme))});if($('in-app-theme'))$('in-app-theme').value=theme;history.replaceState(null,'','#'+theme+'/'+active);}
function inventory(){let q=$('search').value.toLowerCase(),group='';$('inventory').innerHTML=screens.map((s,i)=>{if(!s.join(' ').toLowerCase().includes(q))return '';let header=group!==s[2]?`<div class="category">${s[2]}</div>`:'';group=s[2];return header+`<button class="screen-choice ${s[0]===active?'active':''}" data-screen="${s[0]}"><span>${String(i+1).padStart(2,'0')}</span>${s[1]}</button>`}).join('')}
let timer;function toast(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.add('hidden'),2800)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.theme){theme=b.dataset.theme;render()}else if(b.dataset.screen){active=b.dataset.screen;render()}else if(b.hasAttribute('data-toggle')){let on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.classList.toggle('off',!on)}else if(b.dataset.demo){e.preventDefault();toast(b.dataset.demo+' · sample interaction only')}});$('search').addEventListener('input',inventory);$('previous').onclick=()=>{let i=screens.findIndex(s=>s[0]===active);active=screens[(i-1+screens.length)%screens.length][0];render()};$('next').onclick=()=>{let i=screens.findIndex(s=>s[0]===active);active=screens[(i+1)%screens.length][0];render()};document.addEventListener('change',e=>{if(e.target.id==='in-app-theme'){theme=e.target.value;render()}});document.addEventListener('submit',e=>{if(e.target.id==='composer'){e.preventDefault();let input=e.target.querySelector('input');if(input&&input.value.trim()){(drafts[active]||=[]).push(input.value.trim());render()}else toast('Voice recording · sample only')}});
let hash=location.hash.slice(1).split('/');if(themes[hash[0]])theme=hash[0];if(screens.some(s=>s[0]===hash[1]))active=hash[1];$('count').textContent=screens.length+' screens & states / 3 directions';inventory();render();window.sampleStudy={screens,themes,select:(id,t)=>{if(t)theme=t;active=id;render()}};
</script></body></html>
