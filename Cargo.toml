[workspace]
resolver = "2"
members = ["crates/protocol", "crates/core", "crates/ffi", "apps/linux"]
exclude = ["apps/macos/localPackages/Arti"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/youhanasheriff/bitchat-desktop"
publish = false

[workspace.dependencies]
bitchat-desktop-protocol = { path = "crates/protocol" }
bitchat-desktop-core = { path = "crates/core" }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
