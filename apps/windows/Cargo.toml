[package]
name = "bitchat-desktop-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Native Win32 BitChat Desktop discovery preview"

[[bin]]
name = "bitchat-desktop-windows"
path = "src/main.rs"

[[bin]]
name = "bitchat-scan"
path = "src/scan.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Devices_Bluetooth_Advertisement", "Foundation_Collections", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_WinRT", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
