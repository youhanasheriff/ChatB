[package]
name = "bitchat-desktop-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Native GTK4 BitChat Desktop discovery preview for Linux"

[[bin]]
name = "bitchat-desktop"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures-util = "0.3"
gtk = { package = "gtk4", version = "0.10.3", features = ["v4_8"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
